name: Build Qt5 Windows App

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Скачивание исходников
        uses: actions/checkout@v4

      - name: Установка Qt5 и зависимостей через MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-libssh
            mingw-w64-x86_64-curl

      - name: Сборка проекта (qmake и make)
        shell: msys2 {0}
        run: |
          PRO_FILE=$(find . -name "*.pro" -print -quit)
          if [ -z "$PRO_FILE" ]; then
            echo "Ошибка: Файл .pro не найден!"
            exit 1
          fi
          PRO_DIR=$(dirname "$PRO_FILE")
          cd "$PRO_DIR"
          
          qmake $(basename "$PRO_FILE")
          mingw32-make -j$(nproc)

      - name: Сборка зависимостей (windeployqt)
        shell: msys2 {0}
        run: |
          EXE_FILE=$(find . -name "*.exe" -print -quit)
          if [ -n "$EXE_FILE" ]; then
            windeployqt "$EXE_FILE" --no-compiler-runtime
          fi

      - name: Сохранение готовой программы для Windows
        uses: actions/upload-artifact@v4
        with:
          name: compiled-nesca-windows
          path: |
            **/*.exe
            **/*.dll
            **/plugins/
