name: Build Qt5 App

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Скачивание исходников
        uses: actions/checkout@v4

      - name: Установка зависимостей Qt5 и SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qt5-qmake qtbase5-dev qtmultimedia5-dev libqt5multimediawidgets5 libqt5multimediawidgets5 libqt5multimedia5-plugins libqt5multimedia5 libssh-dev

      - name: Сборка проекта (умный поиск .pro)
        run: |
          # Ищем файл .pro в репозитории
          PRO_FILE=$(find . -name "*.pro" -print -quit)
          
          if [ -z "$PRO_FILE" ]; then
            echo "Ошибка: Файл проекта .pro не найден в репозитории!"
            exit 1
          fi
          
          echo "Найден файл проекта: $PRO_FILE"
          
          # Переходим в папку, где лежит этот файл, если он не в корне
          PRO_DIR=$(dirname "$PRO_FILE")
          cd "$PRO_DIR"
          
          # Запускаем сборку конкретного файла
          qmake $(basename "$PRO_FILE")
          make -j$(nproc)

      - name: Сохранение готовой программы
        uses: actions/upload-artifact@v4
        with:
          name: compiled-ca
          path: |
            **/ca
            **/*.exe
            **/*app*
            !**/*.cpp
            !**/*.h
            !**/*.o
            !**/*.pro
            !**/*.ui
            !**/Makefile
