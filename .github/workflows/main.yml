name: Build Qt5 Windows App

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Скачивание исходников
        uses: actions/checkout@v4

      - name: Установка старого совместимого компилятора (MinGW GCC 9)
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
          version: 9.3.0

      - name: Установка официального Qt5
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_mingw81'

      - name: Авто-исправление заголовочных файлов в коде (cmath)
        shell: bash
        run: |
          # Внедряем cmath во все файлы .cpp, чтобы убрать ошибки математических функций
          for f in $(find . -name "*.cpp"); do
            echo -e "#include <cmath>\n$(cat $f)" > "$f"
          done

      - name: Сборка проекта (qmake и make)
        shell: bash
        run: |
          PRO_FILE=$(find . -name "*.pro" -print -quit)
          if [ -z "$PRO_FILE" ]; then
            echo "Ошибка: Файл .pro не найден!"
            exit 1
          fi
          PRO_DIR=$(dirname "$PRO_FILE")
          cd "$PRO_DIR"
          
          # Запуск сборки на совместимом компиляторе
          qmake $(basename "$PRO_FILE")
          mingw32-make -j$(nproc)

      - name: Сборка зависимостей (windeployqt)
        shell: bash
        run: |
          EXE_FILE=$(find . -name "*.exe" -print -quit)
          if [ -n "$EXE_FILE" ]; then
            windeployqt "$EXE_FILE" --no-compiler-runtime
          fi

      - name: Сохранение готовой программы для Windows
        uses: actions/upload-artifact@v4
        with:
          name: compiled-nesca-windows
          path: |
            **/*.exe
            **/*.dll
            **/plugins/
