name: Build Qt5 Windows App

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Скачивание исходников
        uses: actions/checkout@v4

      - name: Установка Qt5, SSH и CURL через MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-libssh
            mingw-w64-x86_64-curl

      - name: Исправление ошибок кода (добавление cmath)
        shell: msys2 {0}
        run: |
          # Находим файл с ошибкой и добавляем cmath в самое начало
          TARGET_FILE=$(find . -name "DrawerTh_ME2Scanner.cpp" -print -quit)
          if [ -n "$TARGET_FILE" ]; then
            echo "Исправляем файл: $TARGET_FILE"
            echo -e "#include <cmath>\n$(cat $TARGET_FILE)" > "$TARGET_FILE"
          fi

      - name: Сборка проекта (qmake-qt5 и make)
        shell: msys2 {0}
        run: |
          PRO_FILE=$(find . -name "*.pro" -print -quit)
          if [ -z "$PRO_FILE" ]; then
            echo "Ошибка: Файл .pro не найден!"
            exit 1
          fi
          PRO_DIR=$(dirname "$PRO_FILE")
          cd "$PRO_DIR"
          
          qmake-qt5 $(basename "$PRO_FILE")
          mingw32-make -j$(nproc)

      - name: Сборка зависимостей (windeployqt-qt5)
        shell: msys2 {0}
        run: |
          EXE_FILE=$(find . -name "*.exe" -print -quit)
          if [ -n "$EXE_FILE" ]; then
            windeployqt-qt5 "$EXE_FILE" --no-compiler-runtime
            
            # Копируем DLL библиотек libssh, curl и зависимости, чтобы exe запускался на любом ПК
            cp /mingw64/bin/libssh.dll $(dirname "$EXE_FILE") 2>/dev/null || true
            cp /mingw64/bin/libcurl*.dll $(dirname "$EXE_FILE") 2>/dev/null || true
            cp /mingw64/bin/libcrypto*.dll $(dirname "$EXE_FILE") 2>/dev/null || true
            cp /mingw64/bin/libssl*.dll $(dirname "$EXE_FILE") 2>/dev/null || true
          fi

      - name: Сохранение готовой программы для Windows
        uses: actions/upload-artifact@v4
        with:
          name: compiled-nesca-windows
          path: |
            **/*.exe
            **/*.dll
            **/plugins/
