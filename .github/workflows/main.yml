name: Build Qt5 App

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Скачивание исходников
        uses: actions/checkout@v4

      - name: Установка зависимостей Qt5 и SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qt5-qmake qtbase5-dev qtmultimedia5-dev libqt5multimediawidgets5 libqt5multimedia5-plugins libqt5multimedia5 libssh-dev

      - name: Сборка проекта (qmake и make)
        run: |
          qmake
          make -j$(nproc)

      - name: Сохранение готовой программы
        uses: actions/upload-artifact@v4
        with:
          name: compiled-ca
          path: |
            *
            !*.cpp
            !*.h
            !*.o
            !*.pro
            !*.ui
            !*.qrc
            !Makefile
            !Dockerfile
            !README*
            !.git*
            !.github*
